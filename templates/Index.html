<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chahid Warbah 7</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f39c12; --bg: #000; --card: #1e1e1e; --red: #e74c3c; --blue: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #score { font-size: 50px; font-weight: bold; color: var(--gold); margin: 25px 0; }
        .page { display: none; flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 80px; }
        .page.active { display: block; }
        #coin { width: 200px; cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent; margin-top: 40px; }
        #coin:active { transform: scale(0.95); }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .btn-action { background: var(--gold); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; color: black; cursor: pointer; }
        .navbar { background: #111; display: flex; justify-content: space-around; padding: 15px 0; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; }
        .nav-item { background: none; border: none; color: #777; font-weight: bold; font-size: 14px; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
        
        /* Boutique */
        #shop-float { position: fixed; bottom: 85px; right: 20px; width: 60px; height: 60px; background: var(--red); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 25px; z-index: 99; cursor: pointer; border: 2px solid white; }
        #shop-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-close { background: none; border: none; color: white; font-size: 30px; cursor: pointer; }
        .shop-card { background: var(--card); border: 1px solid #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: center; }
        .shop-price { color: var(--gold); font-weight: bold; font-size: 18px; display: block; margin: 10px 0; }
        .input-shop { width: 90%; padding: 10px; border-radius: 8px; border: none; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="score">{{ initial_score }}</div>
    <div id="shop-float" onclick="toggleShop(true)">🛒</div>

    <div id="shop-overlay">
        <div class="shop-header"><h2>BOUTIQUE GIFT</h2><button class="btn-close" onclick="toggleShop(false)">×</button></div>
        <div class="shop-card">
            <h3>🎁 FLEXY DJEEZY</h3>
            <span class="shop-price">30,000 DZ</span>
            <input type="tel" id="djezzy_num" class="input-shop" placeholder="07XXXXXXXX">
            <button class="btn-action" style="width:100%" onclick="buyFlexy()">COMMANDER</button>
        </div>
    </div>

    <div id="tap-page" class="page active">
        <img id="coin" src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png" onclick="handleTap()">
    </div>

    <div id="mining-page" class="page">
        <div class="card">
            <div>🖥️ <b>Mineur CPU</b><br><span style="color:var(--blue)">+1 DZ/s</span></div>
            <button class="btn-action" onclick="acheterMineur(10000)">10,000 DZ</button>
        </div>
        <div class="card">
            <div>🚀 <b>Rig GPU</b><br><span style="color:var(--blue)">+7 DZ/s</span></div>
            <button class="btn-action" onclick="acheterMineur(50000)">50,000 DZ</button>
        </div>
    </div>

    <div id="tasks-page" class="page">
        <div id="missions-container"></div>
    </div>

    <nav class="navbar">
        <button class="nav-item active" onclick="show('tap-page', this)">TAP</button>
        <button class="nav-item" onclick="show('mining-page', this)">MINING</button>
        <button class="nav-item" onclick="show('tasks-page', this)">MISSIONS</button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const uid = String(tg.initDataUnsafe?.user?.id || urlParams.get('user_id') || "6046697939");

        function handleTap() {
            let scoreEl = document.getElementById('score');
            scoreEl.innerText = parseInt(scoreEl.innerText) + 1;
            fetch('/api/tap', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegram_id: uid, taps: 1 }) });
        }

        function initMissions() {
            const container = document.getElementById('missions-container');
            container.innerHTML = "";
            const missions = [
                { id: 1, type: 'linkjust', name: 'Mission Linkjust 1' },
                { id: 2, type: 'linkjust', name: 'Mission Linkjust 2' },
                { id: 3, type: 'exe', name: 'Mission Exe.io 1' },
                { id: 4, type: 'exe', name: 'Mission Exe.io 2' },
                { id: 5, type: 'binance', name: 'Parrainage Binance' },
                { id: 6, type: 'bybit', name: 'Parrainage Bybit' }
            ];
            missions.forEach(m => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div>🚀 <b>${m.name}</b></div><button class="btn-action" onclick="lancerMission('${m.type}', ${m.id})">GO</button>`;
                container.appendChild(card);
            });
        }

        function lancerMission(type, id) {
            if(type === 'linkjust' || type === 'exe') {
                fetch('/api/get_short_link', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: uid, mission_type: type })
                }).then(r => r.json()).then(data => {
                    tg.openLink(data.short_url);
                    setTimeout(() => validerMission(id), 10000);
                });
            } else {
                let lien = (type === 'binance') ? "https://www.binance.com/activity/referral-entry/CPA?ref=CPA_00OODVF08F" : "https://www.bybit.com/invite?ref=EV3EWKR&medium=referral&utm_campaign=evergreen";
                tg.openLink(lien);
                setTimeout(() => validerMission(id), 5000);
            }
        }

        function validerMission(id) {
            fetch('/api/complete_mission', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: uid, mission_id: id })
            }).then(() => { alert("Mission validée !"); location.reload(); });
        }

        function toggleShop(open) { document.getElementById('shop-overlay').style.display = open ? 'block' : 'none'; }
        function show(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(id === 'tasks-page') initMissions();
        }
    </script>
</body>
</html>
