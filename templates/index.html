<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chahid Warbah</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #f39c12; --bg: #000; --card: #1e1e1e; --red: #e74c3c; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; text-align: center; height: 100vh; display: flex; flex-direction: column; }
        #score { font-size: 50px; font-weight: bold; color: var(--gold); margin: 20px 0; }
        .page { display: none; flex-grow: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .page.active { display: block; }
        #coin { width: 200px; cursor: pointer; margin-top: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .navbar { background: #111; display: flex; justify-content: space-around; padding: 15px 0; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; }
        .nav-item { background: none; border: none; color: #777; font-weight: bold; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>
    <div id="score">0</div>
    <div id="tap-page" class="page active"><img id="coin" src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png" onclick="handleTap()"></div>
    
    <div id="mining-page" class="page">
        <div class="card"><div>🖥️ Mineur (Coût: 10k)</div><button id="btnMiner" onclick="buyMiner()">Acheter</button></div>
    </div>

    <div id="tasks-page" class="page">
        <div class="card"><div>Binance</div><button id="btn1" onclick="startMission('exe', 'btn1', 'https://www.binance.com/...', 600)">OK</button></div>
        <div class="card"><div>Bybit</div><button id="btn2" onclick="startMission('exe', 'btn2', 'https://www.bybit.com/...', 600)">OK</button></div>
        <div class="card"><div>Linkjust</div><button id="btn3" onclick="startMission('linkjust', 'btn3', 'https://linkjust.com/...', 600)">OK</button></div>
        <div class="card"><div>Exe.io</div><button id="btn4" onclick="startMission('exe', 'btn4', 'https://exe.io/...', 600)">OK</button></div>
    </div>
    
    <nav class="navbar">
        <button class="nav-item active" onclick="show('tap-page', this)">TAP</button>
        <button class="nav-item" onclick="show('mining-page', this)">MINING</button>
        <button class="nav-item" onclick="show('tasks-page', this)">MISSIONS</button>
    </nav>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const uid = String(tg.initDataUnsafe?.user?.id || "6046697939");

        fetch('/api/score?telegram_id=' + uid).then(r => r.json()).then(data => { document.getElementById('score').innerText = data.score; });

        async function startMission(service, btnId, url, bonus) {
            const btn = document.getElementById(btnId);
            btn.innerText = "...";
            try {
                const res = await fetch('/api/shorten', { 
                    method: 'POST', headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ service, url }) 
                });
                const data = await res.json();
                if(data.short_url) { 
                    window.open(data.short_url, '_blank'); 
                    completeTask(btnId, bonus, btnId); 
                } else { btn.innerText = "Erreur"; }
            } catch (e) { btn.innerText = "Erreur"; }
        }

        async function completeTask(btnId, bonus, taskName) {
            const btn = document.getElementById(btnId);
            const res = await fetch('/api/complete_task', { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ telegram_id: uid, bonus: bonus, task_name: taskName }) 
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('score').innerText = data.new_score;
                btn.innerText = "DONE"; btn.disabled = true; btn.style.background = "green";
            } else { alert(data.message); btn.innerText = "OK"; }
        }

        async function buyMiner() {
            const btn = document.getElementById('btnMiner');
            btn.innerText = "...";
            const res = await fetch('/api/buy_miner', { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ telegram_id: uid }) 
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('score').innerText = data.new_score;
                btn.innerText = "OWNED"; btn.disabled = true;
            } else { alert(data.message); btn.innerText = "Acheter"; }
        }

        function handleTap() { fetch('/api/tap', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ telegram_id: uid }) })
            .then(r => r.json()).then(d => { document.getElementById('score').innerText = d.new_score; }); }

        function show(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
